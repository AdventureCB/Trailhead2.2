<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .err { color: #8B7D6B; font: 13px "Trebuchet MS", sans-serif; display: flex; align-items: center; justify-content: center; height: 100%; }
</style>
</head>
<body>
<script>
  // YouTube embed shim for the native app. Inside the Capacitor shell the
  // page origin is https://localhost, which YouTube's embed player rejects
  // (no valid referrer → "Video unavailable"). Framing THIS page instead
  // makes the referrer our real domain, so the player loads. The app only
  // uses this on native; web embeds YouTube directly.
  var v = (new URLSearchParams(location.search).get("v") || "").trim();
  if (/^[A-Za-z0-9_-]{6,20}$/.test(v)) {
    var f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + v + "?playsinline=1&rel=0";
    f.title = "YouTube video";
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    f.allowFullscreen = true;
    f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="err">Video unavailable</div>';
  }
</script>
</body>
</html>
